  <figcaption>
    <strong>As I Lay Dying’s</strong> track <em>"94 Hours"</em> helped define early 2000s metalcore with a mix of chugging riffs, breakdowns, and frantic drumming that felt like a panic attack with guitar solos. 
    <strong>Here is a fun fact for you:</strong> during their early days, the band toured so relentlessly that their van literally caught fire—not once, but twice. One of those times, it was in the middle of a frozen Canadian highway. They barely made it out, lost their gear, and kept playing shows anyway. So, yeah :)
