  <figcaption>
    <strong>'Til We Die</strong> is a track from All Hope Is Gone, the fourth studio album by <strong>Slipknot</strong>, released in 2008. The song, an emotional and heavy-hitting closer, was originally a bonus track on special editions of the album. All Hope Is Gone was the first Slipknot album to debut at No. 1 on the Billboard 200. It also marked the final studio recording featuring bassist Paul Gray and drummer Joey Jordison before their respective departures. The album showcased a blend of their signature aggression with some of their most melodic work to date.
