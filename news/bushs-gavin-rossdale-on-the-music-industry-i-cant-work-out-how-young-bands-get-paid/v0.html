  <figcaption>
    <strong>Gavin Rossdale</strong> talks about nostalgia as he reflects on <em>"Glycerine"</em>—a track that defined a decade and made every '90s mixtape just a little more emotional. It’s not just about the song; it’s about what it meant to be in <strong>Bush</strong> at a time when grunge met pop charts and eyeliner budgets tripled. <strong>Fun fact:</strong> despite being one of Bush’s most recognizable hits, <em>"Glycerine"</em> features no drums. Zero. Nada. That minimalist approach wasn’t exactly planned—they simply ran out of time to lay down the percussion, and Rossdale liked the raw vibe so much that he left it as-is. Sometimes procrastination sounds like genius.
