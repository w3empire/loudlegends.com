  <figcaption>
    <strong>Bush</strong>'s breakout ballad <em>"Glycerine"</em> delivers maximum melancholy with minimal frills—just haunting vocals, a grainy backdrop, and enough emotional weight to carry a breakup from the ‘90s straight through to your 30s. It’s one of those songs that somehow still hits like it just dropped yesterday. <strong>Fun fact:</strong> the video was shot in a single day during a surprise snowstorm in Atlanta—completely unplanned. Director <strong>Kevin Kerslake</strong> decided to roll with it, and the result is that rare music video where freezing weather accidentally turns into aesthetic. Meanwhile, Gavin Rossdale reportedly had to lip-sync while trying not to shiver mid-line. Commitment.
