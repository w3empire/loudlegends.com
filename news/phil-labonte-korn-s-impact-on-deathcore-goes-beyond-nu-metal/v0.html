  <figcaption>
    Did you know that Phil Labonte, vocalist of All That Remains, once auditioned for Killswitch Engage, not once, but twice. After Jesse Leach's first departure, Labonte gave it a shot but didn’t get the gig. He tried again after Howard Jones left, and still didn’t make it. Labonte later joked that he must’ve “dodged a bullet,” though fans of both bands might call it a near miss for metalcore history.
