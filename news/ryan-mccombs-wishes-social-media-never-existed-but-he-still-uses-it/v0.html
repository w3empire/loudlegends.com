    When Ryan McCombs returned to Drowning Pool, it wasn’t the first time he’d circled back to a band. In the mid-2000s, he left SOiL at their commercial peak and later rejoined them over a decade later, without missing a beat. What’s wild is that McCombs once revealed he suffered a stroke on stage and finished the show anyway. Doctors confirmed it after. He just thought he “felt off.”
