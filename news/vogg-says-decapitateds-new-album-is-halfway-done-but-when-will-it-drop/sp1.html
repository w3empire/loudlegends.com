  <figcaption>
    <strong>Decapitated</strong>'s Nihility is a technical onslaught of precision so tight it could probably perform heart surgery. Released in <strong>2002</strong>, this was the record that cemented their place among extreme metal’s elite. The band was insanely young at the time—guitarist <strong>Vogg</strong> was barely out of his teens, and their drummer, <strong>Vitek</strong>, was just <em>17</em> when he recorded those machine-gun blast beats. That means some of the tightest, most complex drumming in death metal history was played by a guy who probably still had to ask his parents for a ride to practice.
