  <figcaption>
    The <strong>Blood Dynasty</strong> cover art by <strong>Arch Enemy</strong> leans hard into regal horror—with zombified monarchs, demonic warlords, and children that look like they’d haunt your attic. It’s disturbingly elegant and pretty much perfect for a melodic death metal band.
    <strong>Bonus detail:</strong> While the band doesn’t always drop details about their artwork inspirations, longtime collaborator <strong>Eliran Kantor</strong> (who also worked with Testament and Helloween) once said his goal was to create visuals that feel like “they’re whispering threats to you.” Which... yeah, mission accomplished. - 📸 Image: Reproduction / Press Release
