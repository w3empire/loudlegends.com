  <figcaption>
    <strong>Korn’s</strong> 1997 hit <strong>"A.D.I.D.A.S."</strong> wasn’t just a nu-metal anthem—it was also a lightning rod for controversy, thanks to its title (which allegedly stands for <em>"All Day I Dream About Sex"</em>). While it fueled parental outrage and tabloid fodder, it also cemented the band’s status as one of the most unfiltered voices in '90s alt-metal. <strong>Fun bit:</strong> frontman <strong>Jonathan Davis</strong> used to perform this song wearing an actual Adidas tracksuit, not as a marketing deal, but because he liked how it felt on stage. Adidas didn’t pay them a cent at the time. Years later, they tried to cozy up to the band—because nothing says corporate regret like missing out on merch gold.
