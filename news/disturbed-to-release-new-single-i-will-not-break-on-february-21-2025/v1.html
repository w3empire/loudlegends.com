    <strong>Disturbed</strong> brought primal rage to the mainstream with <em>Down With The Sickness</em>, a song instantly recognizable for David Draiman’s guttural, almost animalistic intro. That infamous “ooh-wah-ah-ah-ah” was actually a studio accident—Draiman was just messing around, and the band liked it so much they kept it. And that’s how one of the most mimicked sounds in metal history was born. Imagine accidentally inventing a whole new vocal move and having metalheads imitate it for decades.
