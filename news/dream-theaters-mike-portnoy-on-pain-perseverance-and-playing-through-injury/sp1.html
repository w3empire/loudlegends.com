  <figcaption>
    <strong>Dream Theater</strong> is a progressive metal institution, there I said it. Their album <strong>Parasomnia</strong> continues their tradition of pushing technical boundaries while making your fingers hurt just from listening. Here’s a wild fact: Dream Theater’s former drummer, <strong>Mike Mangini</strong>, once held the world record for most beats per minute on a drum roll—1,247 BPM. That’s basically hummingbird-wing speed but with drumsticks. Meanwhile, original drummer <strong>Mike Portnoy</strong> had such an obsessive love for odd time signatures that he once admitted to structuring daily activities around different time signatures. Imagine brushing your teeth in 7/8 and walking in 5/4—pure chaos, but also very on-brand for Dream Theater.
